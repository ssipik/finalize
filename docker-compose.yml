# One-off runs: docker compose run --rm pipeline python -m rag_finalize --run-id <id>
# Needs ../postgres and ../qdrant up (deletions touch Qdrant).
services:
  pipeline:
    build:
      context: .
      secrets:
        - git_token
    command: python -m rag_finalize --run-id all-20260728T150308Z
    # command: tail -f /dev/null
    volumes:
      # live-mount code over the image copy (edit without rebuild); sources.yaml
      # and parameters.yaml come from the rag-config dependency, not from here
      - ./src:/app
      - ./.vscode:/app/.vscode
    environment:
      # host.docker.internal = the host machine, where the services publish
      RAG_PG_DSN: postgresql+psycopg://rag:rag@host.docker.internal:5433/rag_ingestion
      RAG_QDRANT_URL: http://host.docker.internal:6333

# Build-time only: the private rag-config repo is cloned by `uv sync` in the
# Dockerfile. BuildKit mounts this for that one RUN, so no layer holds it.
secrets:
  git_token:
    environment: RAG_BITBUCKET_API_TOKEN
